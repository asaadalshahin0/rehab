<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100vh;min-height:100dvh;background:#0a0a0f}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes burst{0%{transform:scale(0.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.5}}
input[type=range]{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.06);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer}
textarea{font-family:'Outfit',sans-serif}
::selection{background:rgba(34,197,94,0.3)}
::-webkit-scrollbar{width:0;height:0}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useCallback,useRef} = React;

const SESSIONS_TO_UNLOCK = 7;
const DAILY_PAIN_THRESHOLD = 3;
const DEFAULT_REST = 60;
const TODAY = () => new Date().toISOString().split("T")[0];
const YESTERDAY = () => { const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().split("T")[0]; };
const pr = (ok, stop) => ({ok, stop});

const KNEE_PHASES = [
  {id:1,name:"Settle & Rebuild",freq:"Strength 3 days per week with a rest day between sessions. Keep normal activity, but temporarily reduce the depth, speed, hills, stairs, running, or jumping that clearly spikes symptoms.",rationale:"Patellofemoral pain is managed by matching kneecap-joint load to current capacity. Start with tolerable knee work plus hip strengthening; complete rest is not the goal.",warmup:"5 minutes easy walking or cycling. Use a comfortable pace and short range if the knee is irritable.",exercises:[
    {name:"Chair Sit-to-Stand",sets:3,reps:8,unit:"reps",rest:60,notes:"Use a higher chair if needed. Knees track over the middle toes; move slowly and evenly.",pain:pr("0-3/10 and settles after","Stop if pain is sharp, rising, changes your movement, or is worse the next morning.")},
    {name:"Bridge",sets:3,reps:10,holdSec:2,unit:"reps",rest:45,notes:"Squeeze glutes for 2 seconds at the top. Keep ribs down and weight even through both feet.",pain:pr("0-2/10 at the knee","Shorten the range or move the feet if the knee is irritated.")},
    {name:"Side-Lying Hip Abduction",sets:3,reps:10,unit:"reps/side",rest:45,notes:"Top leg straight and slightly behind you; keep the pelvis stacked instead of rolling back.",pain:pr("Pain-free at the knee","Stop if it reproduces knee pain; check position before adding resistance.")},
    {name:"Standing Calf Raise",sets:3,reps:12,unit:"reps",rest:45,notes:"Use support for balance. Rise and lower under control.",pain:pr("0-2/10 at the knee","Reduce range or use both legs if symptoms rise.")},
  ]},
  {id:2,name:"Hip + Knee Strength",freq:"3 days per week with at least one recovery day between sessions. Add load only when the current version stays within the pain rule that day and the next morning.",rationale:"The strongest consistent recommendation for patellofemoral pain is exercise targeting both the knee and posterolateral hip. This phase builds that base through a controlled, tolerable range.",warmup:"5 minutes easy walk or cycle, then 8 comfortable sit-to-stands.",exercises:[
    {name:"Goblet Squat to Chair",sets:3,reps:10,unit:"reps",rest:75,notes:"Start bodyweight, then hold a light weight. Use the chair to standardize a pain-tolerable depth.",pain:pr("0-3/10 and back to baseline within 24 hours","Raise the chair, reduce load, or stop if pain is sharp or changes your form.")},
    {name:"Low Step-Up",sets:3,reps:10,unit:"reps/side",rest:60,notes:"Use a 4-6 inch step. Drive through the whole foot; control the return down.",pain:pr("0-3/10","Use a lower step or hand support if pain rises.")},
    {name:"Lateral Band Walk",sets:3,reps:10,unit:"steps/dir",rest:45,notes:"Band above the knees to start. Stay tall with toes forward and small controlled steps.",pain:pr("Pain-free or mild ≤2/10","Use a lighter band or smaller steps if the knee is irritated.")},
    {name:"Bridge March",sets:3,reps:8,unit:"reps/side",rest:45,notes:"Hold a level bridge while slowly lifting one foot at a time. Return to a regular bridge if the pelvis rotates.",pain:pr("0-2/10 at the knee","Return to bilateral bridge if symptoms rise.")},
  ]},
  {id:3,name:"Progressive Strength",freq:"3 days per week. Increase only one variable at a time: first reps, then range, then a small amount of load.",rationale:"PFPS generally improves as knee and hip capacity rises. This phase moves from introductory exercises to stronger squatting, stepping, and hip work without chasing pain or perfect alignment.",warmup:"5 minutes easy walk or cycle, 8 squats to a chair, then 6 low step-ups per side.",exercises:[
    {name:"Goblet Squat",sets:3,reps:8,unit:"reps",rest:90,notes:"Use a controlled, comfortable depth. Add a light weight only after bodyweight feels steady.",pain:pr("0-3/10 and no next-day increase","Reduce depth or load if pain is sharp, rising, or lingers into the next morning.")},
    {name:"Step-Up",sets:3,reps:10,unit:"reps/side",rest:75,notes:"Progress the step gradually from 6 inches. Control the return down instead of dropping.",pain:pr("0-3/10","Lower the step or use support if symptoms rise.")},
    {name:"Standing Hip Abduction",sets:3,reps:12,unit:"reps/side",rest:45,notes:"Band above the knees or ankles. Stay tall and avoid leaning the trunk.",pain:pr("Pain-free or mild ≤2/10","Use a lighter band if the knee is irritated.")},
    {name:"Bridge March",sets:3,reps:10,unit:"reps/side",rest:45,notes:"Keep the pelvis level and move slowly. Progress to single-leg bridge only when controlled.",pain:pr("0-2/10 at the knee","Return to a regular bridge if symptoms rise.")},
  ]},
  {id:4,name:"Single-Leg Capacity",freq:"3 days per week. Keep other high-load knee activity steady rather than increasing training and rehab at the same time.",rationale:"Single-leg strength and movement control prepare the knee for stairs, longer walks, work, and sport. The target is smooth control—not forcing the kneecap into one perfect path.",warmup:"5 minutes easy walk or cycle, 8 squats, then 6 low step-downs per side.",exercises:[
    {name:"Supported Split Squat",sets:3,reps:8,unit:"reps/side",rest:75,notes:"Hold a counter for balance. Keep a comfortable stride and begin with a shallow range.",pain:pr("0-3/10 and no next-day increase","Shorten the range or unload with your hands if symptoms rise.")},
    {name:"Low Step-Down",sets:3,reps:8,unit:"reps/side",rest:75,notes:"Stand on a 2-4 inch step and tap the opposite heel down slowly. Keep the pelvis level.",pain:pr("0-3/10","Lower the step or use support if pain changes your control.")},
    {name:"Single-Leg Bridge",sets:3,reps:8,unit:"reps/side",rest:60,notes:"Keep hips level. If hamstrings cramp or the pelvis drops, use bridge march instead.",pain:pr("0-2/10 at the knee","Regress to bridge march if the knee is irritated.")},
    {name:"Single-Leg Calf Raise",sets:3,reps:10,unit:"reps/side",rest:45,notes:"Use fingertip support and a slow full range. Use two legs if one-leg work is not controlled.",pain:pr("0-2/10 at the knee","Switch to double-leg raises if pain rises.")},
  ]},
  {id:5,name:"Return to Activity",freq:"Strength 2-3 days per week. Reintroduce stairs, hills, running, jumping, or sport one variable at a time—first volume, then speed, then intensity.",rationale:"PFPS recovery is not just a pain score; it is restoring confidence and capacity for the activities that matter to you. Maintain hip and knee strength while graded exposure bridges back to normal activity.",warmup:"5-8 minutes progressive walking or cycling, then 8 squats and 6 step-downs per side in an easy range.",exercises:[
    {name:"Loaded Squat",sets:3,reps:8,unit:"reps",rest:90,notes:"Choose a depth and load you can control. Add a small amount of weight before adding more depth if deeper flexion is sensitive.",pain:pr("0-3/10 and back to baseline by next morning","Reduce depth or load by 20-30% if symptoms linger.")},
    {name:"Loaded Split Squat",sets:3,reps:8,unit:"reps/side",rest:90,notes:"Add light dumbbells only after bodyweight reps are smooth and within the pain rule.",pain:pr("0-3/10","Reduce depth, load, or use support if symptoms rise.")},
    {name:"Step-Down",sets:3,reps:10,unit:"reps/side",rest:75,notes:"Progress step height gradually. Lower for 3 seconds and lightly tap the heel.",pain:pr("0-3/10","Return to the prior step height if control or pain worsens.")},
    {name:"Graded Activity Exposure",sets:1,duration:600,unit:"sec",rest:0,notes:"Choose the activity you want back: brisk walking, stairs, hills, jogging, jumping, or sport drills. Begin around 50-60% of your usual volume and keep speed/intensity easy.",pain:pr("0-3/10 and no next-day increase","Cut the dose by 20-30% if symptoms linger; increase only one variable after two well-tolerated exposures.")},
  ]},
  {id:6,name:"If Pain Flares",flarePhase:true,freq:"Use this phase whenever symptoms rise above your normal baseline or remain elevated the next morning. Reduce the provoking activity for several days, but keep a tolerable amount of movement and strength work.",rationale:"A flare usually calls for a temporary load adjustment, not starting over. Use easier ranges and loads, then return to your prior phase when daily activity is settling and this session does not worsen the next morning.",warmup:"5 minutes very easy walking or cycling. If that increases symptoms, shorten it and use comfortable motion only.",exercises:[
    {name:"High-Chair Sit-to-Stand",sets:3,reps:8,unit:"reps",rest:60,notes:"Raise the seat and use hands as needed. Stay in the easiest comfortable range.",pain:pr("0-2/10 preferred","Stop if pain is sharp, rising, or changes your movement.")},
    {name:"Bridge",sets:3,reps:10,holdSec:2,unit:"reps",rest:45,notes:"Use a comfortable foot position and keep the movement smooth.",pain:pr("0-2/10 at the knee","Shorten the range or stop if symptoms increase.")},
    {name:"Side-Lying Hip Abduction",sets:3,reps:10,unit:"reps/side",rest:45,notes:"Keep the pelvis stacked and use no band during a flare.",pain:pr("Pain-free at the knee","Stop if it reproduces knee pain.")},
    {name:"Double-Leg Calf Raise",sets:3,reps:10,unit:"reps",rest:45,notes:"Use support and a comfortable range.",pain:pr("0-2/10 at the knee","Reduce range or stop if symptoms rise.")},
  ]},
];

const FOREARM_PHASES = [
  {id:1,name:"Calm & Reconnect",freq:"Use this easy session 4-5 days per week. Temporarily reduce forceful gripping, repeated screwdriver/hammer motions, heavy curls, and high-volume palm-down rotation that clearly raises symptoms.",rationale:"This educational pathway assumes a clinician has ruled out a significant tear, fracture, tendon injury, and median-nerve entrapment. Begin with comfortable forearm rotation and low-effort isometrics; chronic symptoms still need an individualized assessment if they are not improving.",warmup:"Apply comfortable warmth if it helps, then make 10 easy fists and complete 10 slow palm-up/palm-down turns with the upper arm relaxed at your side.",exercises:[
    {name:"Supported Pronation / Supination",sets:2,reps:10,unit:"reps",rest:30,notes:"Rest the forearm on a table with the elbow bent about 90°. Slowly turn the palm up, then down, staying inside a comfortable range.",pain:pr("Pain-free or mild ≤2/10","Stop for sharp pain, tingling, numbness, or a clear loss of motion.")},
    {name:"Gentle Pronation Isometric",sets:5,reps:1,holdSec:10,unit:"hold",rest:30,notes:"Start thumb-up. Try to turn the palm down while the other hand blocks all movement. Use about 20-30% effort.",pain:pr("Mild effort without symptom spread","Reduce effort or stop if pain rises during the hold or lingers afterward.")},
    {name:"Gentle Wrist-Flexion Isometric",sets:4,reps:1,holdSec:10,unit:"hold",rest:30,notes:"Forearm supported, palm up. Try to bend the wrist while the other hand prevents movement. Keep the fingers relaxed.",pain:pr("0-2/10","Stop if pain becomes sharp or travels into the hand.")},
    {name:"Scapular Set",sets:3,reps:10,unit:"reps",rest:30,notes:"Sit or stand tall. Gently draw the shoulder blade back and down without shrugging; relax fully between reps.",pain:pr("Pain-free","Use less effort if the neck or forearm tenses.")},
  ]},
  {id:2,name:"Supported Strength",freq:"Strength 3 days per week with a recovery day between sessions. Start with no external weight; progress only when the session and next morning remain stable.",rationale:"Supported forearm work shortens the lever and makes pronation load easier to control. The goal is quiet, repeatable movement—not testing maximum strength.",warmup:"Complete 10 supported palm-up/palm-down turns, then 3 gentle 10-second pronation isometrics.",exercises:[
    {name:"Supported Band Pronation",sets:3,reps:10,unit:"reps",rest:45,notes:"Elbow bent about 90° and forearm supported. Start palm-up or thumb-up and rotate toward palm-down against a very light band. Return slowly.",pain:pr("0-2/10 and baseline by next morning","Use a lighter band or smaller range if symptoms rise.")},
    {name:"Short-Lever Hammer Rotation",sets:3,reps:10,unit:"reps",rest:45,notes:"Hold an unweighted hammer close to the head, forearm supported. Slowly rotate palm up and down. Move the grip farther from the head only after this is easy.",pain:pr("Controlled and ≤2/10","Stop if the wrist bends, the upper arm twists, or symptoms spread into the hand.")},
    {name:"Light Wrist Flexion",sets:3,reps:12,unit:"reps",rest:45,notes:"Forearm supported, palm up. Use no weight or a very light weight; lift for 2 seconds and lower for 3 seconds.",pain:pr("0-2/10","Return to the isometric version if discomfort increases afterward.")},
    {name:"Gentle Grip Squeeze",sets:3,reps:10,holdSec:3,unit:"reps",rest:30,notes:"Squeeze a soft towel or ball at about half effort. Keep the wrist neutral and shoulder relaxed.",pain:pr("Comfortable, no symptom spread","Stop if grip triggers tingling, numbness, or hand weakness.")},
  ]},
  {id:3,name:"Progressive Rotation",freq:"Strength 3 days per week. Increase only one variable at a time: repetitions, then lever length, then a small amount of resistance.",rationale:"Both lowering and lifting phases build capacity. AAOS guidance progresses forearm rotation from no weight to light weights only after repeated sessions do not increase pain.",warmup:"10 easy forearm rotations, 8 wrist curls with no weight, then 2 light pronation isometrics.",exercises:[
    {name:"Supported Pronation / Supination Load",sets:3,reps:12,unit:"reps",rest:60,notes:"Use a light hammer or 1 lb weight with the elbow bent and forearm supported. Rotate slowly through a comfortable range.",pain:pr("0-3/10 and no next-day increase","Shorten the lever or remove weight if control or symptoms worsen.")},
    {name:"Eccentric Pronation",sets:3,reps:8,unit:"reps",rest:60,notes:"Use the other hand to help return toward palm-up. With the working arm, lower slowly toward palm-down for 4 seconds.",pain:pr("Mild, controlled ≤3/10","Stop for sharp pain, shaking loss of control, or symptoms that linger into the next morning.")},
    {name:"Wrist Flexion + Extension",sets:3,reps:12,unit:"reps each",rest:45,notes:"Forearm supported. Use a light weight and complete slow wrist curls palm-up, then palm-down.",pain:pr("0-2/10","Reduce weight or range if forearm pain rises.")},
    {name:"Light Band Row",sets:3,reps:12,unit:"reps",rest:45,notes:"Keep the wrist neutral and pull the elbows back without forceful gripping. Use a light loop or handles.",pain:pr("Pain-free or mild ≤2/10","Use less band tension if gripping or rotation symptoms appear.")},
  ]},
  {id:4,name:"Long-Lever Capacity",freq:"Strength 2-3 days per week. Keep heavy work, racquet sport, throwing, or tool use steady while this phase is progressing.",rationale:"A slightly straighter arm and less support increase the demand on the pronator teres. Advance only after supported loading is comfortable and normal daily tasks are not worse afterward.",warmup:"10 supported rotations, 8 light hammer rotations, then 10 easy band rows.",exercises:[
    {name:"Longer-Lever Forearm Rotation",sets:3,reps:10,unit:"reps",rest:60,notes:"Support the arm with the elbow only slightly bent. Use no weight first, then the lightest weight that stays controlled.",pain:pr("0-3/10 with no next-day increase","Return to the bent-elbow supported version if pain or control worsens.")},
    {name:"Band Pronation — Slight Elbow Bend",sets:3,reps:10,unit:"reps",rest:60,notes:"Keep the wrist straight and upper arm quiet. Rotate against a light band with the elbow slightly bent rather than fully supported.",pain:pr("Smooth and ≤3/10","Reduce tension or range if the forearm tightens sharply.")},
    {name:"Suitcase Carry",sets:3,duration:30,unit:"sec",rest:60,notes:"Carry a light weight at your side with a neutral wrist and relaxed shoulder. Grip only firmly enough to control it.",pain:pr("No symptom spread; ≤2/10","Stop if grip fades, objects feel unsafe, or numbness/tingling appears.")},
    {name:"Wall Push-Up",sets:3,reps:10,unit:"reps",rest:45,notes:"Hands at shoulder height, wrists comfortable. Keep the movement slow and avoid locking the elbows hard.",pain:pr("Pain-free or mild ≤2/10","Move closer to the wall or stop if forearm symptoms rise.")},
  ]},
  {id:5,name:"Return to Demand",freq:"Keep strength work 2-3 days per week. Reintroduce work, tools, lifting, racquet sport, or throwing in short intervals; increase duration before force or speed.",rationale:"Return is based on function, not a calendar date. Aim for full comfortable rotation, stable next-day symptoms, and grip/pronation capacity approaching the other side before normal high-force or repetitive use.",warmup:"5 minutes of general movement, 10 forearm rotations, 8 light pronation reps, and 10 easy grip squeezes.",exercises:[
    {name:"Position-Varied Pronation",sets:3,reps:8,unit:"reps/position",rest:60,notes:"Use a light band in two positions: elbow bent at your side, then slightly straighter. Keep the wrist neutral and motion controlled.",pain:pr("0-3/10 and stable next morning","Return to one supported position if symptoms rise.")},
    {name:"Carry + Grip Capacity",sets:3,duration:45,unit:"sec",rest:75,notes:"Use a manageable suitcase carry. Keep grip steady without white-knuckling or compensating at the shoulder.",pain:pr("No weakness or symptom spread","Stop if grip fades unexpectedly or you feel unsafe holding the load.")},
    {name:"Task-Specific Rotation",sets:3,reps:8,unit:"reps",rest:60,notes:"Practice the exact pattern you need—light tool turns, racquet shadow swings, pouring, or controlled throwing setup—at low force and speed.",pain:pr("0-3/10, controlled, no next-day increase","Cut volume by 20-30% if symptoms linger; do not push through neurologic symptoms.")},
    {name:"Graded Work / Sport Exposure",sets:1,duration:600,unit:"sec",rest:0,notes:"Begin around half your usual duration at easy effort. After two stable exposures, add a little time; add force or speed later.",pain:pr("Symptoms remain mild and return to baseline by next morning","Stop and regress if pain climbs, function drops, or recovery takes longer than 24 hours.")},
  ]},
  {id:6,name:"If Forearm Pain Flares",flarePhase:true,freq:"Use this phase when forearm symptoms rise above baseline or remain elevated the next morning. Reduce the provoking dose for several days, but keep comfortable motion.",rationale:"A flare calls for a temporary reduction in load, not a strength test. If the flare includes numbness, tingling, hand weakness, dropping objects, or loss of thumb/index pinch, stop this pathway and seek clinical assessment.",warmup:"Make 10 easy fists and complete 10 slow, unloaded palm-up/palm-down turns in the most comfortable range.",exercises:[
    {name:"Easy Supported Rotation",sets:2,reps:8,unit:"reps",rest:30,notes:"Forearm supported, elbow bent. Move slowly between palm-up and palm-down without forcing the end range.",pain:pr("0-2/10","Stop for sharp pain or any neurologic symptom.")},
    {name:"Low-Effort Pronation Isometric",sets:4,reps:1,holdSec:8,unit:"hold",rest:30,notes:"Use the other hand to block movement and press at only 20% effort.",pain:pr("Comfortable and local","Stop if pain spreads or remains higher after the session.")},
    {name:"Soft Towel Squeeze",sets:2,reps:10,holdSec:2,unit:"reps",rest:30,notes:"Use a soft towel and light effort with the wrist neutral.",pain:pr("Pain-free","Stop if grip feels weak, clumsy, numb, or tingly.")},
    {name:"Scapular Set",sets:2,reps:10,unit:"reps",rest:30,notes:"Gently draw the shoulder blade back and down without tensing the forearm.",pain:pr("Pain-free","Use less effort if the forearm tightens.")},
  ]},
];

const TRACKS = [
  {key:"knee",label:"Right Knee",shortLabel:"Knee",sub:"Patellofemoral Pain Syndrome",icon:"🦵",ph:KNEE_PHASES},
  {key:"forearm",label:"Right Forearm",shortLabel:"Forearm",sub:"Chronic Pronator Teres Strain",icon:"💪",ph:FOREARM_PHASES},
];
const getTrackMeta = key => TRACKS.find(t=>t.key===key)||TRACKS[0];

// Storage
function loadState(){try{
  const resetKey="rehab-pfps-reset-2026-07-29";
  if(!localStorage.getItem(resetKey)){
    localStorage.removeItem("rehab-v3");
    localStorage.removeItem("rehab-pfps-v1");
    localStorage.setItem(resetKey,"done");
  }
  const d=localStorage.getItem("rehab-pfps-v1");
  const parsed=d?JSON.parse(d):{};
  return {...parsed,knee:parsed.knee||{phase:1,sessions:[]},forearm:parsed.forearm||{phase:1,sessions:[]}};
}catch{return{knee:{phase:1,sessions:[]},forearm:{phase:1,sessions:[]}};}}
function saveState(s){try{localStorage.setItem("rehab-pfps-v1",JSON.stringify(s));}catch(e){console.error(e);}}

// ── SFX ──
const _sfxCtx={c:null};
function getSfxCtx(){
  if(!_sfxCtx.c){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)_sfxCtx.c=new AC();
  }
  if(_sfxCtx.c&&_sfxCtx.c.state==="suspended")_sfxCtx.c.resume();
  return _sfxCtx.c;
}
function _tone(freq,vol,start,dur,type="sine",ctx){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.start(start);o.stop(start+dur+0.01);
}
const sfx={
  tick(){try{const ctx=getSfxCtx();if(!ctx)return;const t=ctx.currentTime;_tone(900,0.12,t,0.07,"sine",ctx);}catch{}},
  restStart(){try{const ctx=getSfxCtx();if(!ctx)return;const t=ctx.currentTime;_tone(440,0.1,t,0.12,"sine",ctx);}catch{}},
  restDone(){try{const ctx=getSfxCtx();if(!ctx)return;const t=ctx.currentTime;[0,0.11,0.22].forEach((d,i)=>_tone([523,659,784][i],0.14,t+d,0.28,"sine",ctx));}catch{}},
  complete(){try{const ctx=getSfxCtx();if(!ctx)return;const t=ctx.currentTime;[0,0.1,0.2,0.3].forEach((d,i)=>_tone([523,659,784,1047][i],0.16,t+d,0.38,"sine",ctx));}catch{}},
  unlock(){try{const ctx=getSfxCtx();if(!ctx)return;const t=ctx.currentTime;[0,0.09,0.18,0.27,0.36,0.45].forEach((d,i)=>_tone([523,659,784,1047,1319,1568][i],0.15,t+d,0.55,"sine",ctx));}catch{}},
};

// ── Rest Timer ──
function RestTimer({seconds,onDone}){
  const[left,setLeft]=useState(seconds);
  const[active,setActive]=useState(false);
  const[done,setDone]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{
    if(!active)return;
    ref.current=setInterval(()=>{
      setLeft(p=>{
        if(p<=1){clearInterval(ref.current);setDone(true);setActive(false);if(onDone)onDone();sfx.restDone();try{navigator.vibrate&&navigator.vibrate([80,40,80]);}catch{}return 0;}
        return p-1;
      });
    },1000);
    return()=>clearInterval(ref.current);
  },[active]);

  if(done)return(<div style={{textAlign:"center",padding:"8px 0",fontSize:11,fontFamily:"'Fira Code',monospace",color:"#22c55e",fontWeight:700,animation:"fadeIn 0.2s ease"}}>REST DONE — NEXT SET ↓</div>);

  const mins=Math.floor(left/60);
  const secs=left%60;
  const display=mins>0?`${mins}:${String(secs).padStart(2,"0")}`:`${secs}s`;
  const pct=(seconds-left)/seconds;

  return(<div style={{padding:"10px 0",display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
    {!active?
      <button onClick={()=>{setActive(true);sfx.restStart();}} style={{padding:"6px 16px",borderRadius:8,border:"1px solid rgba(96,165,250,0.2)",background:"rgba(96,165,250,0.06)",color:"rgba(147,197,253,0.8)",fontSize:12,fontFamily:"'Fira Code',monospace",fontWeight:700,cursor:"pointer"}}>⏱ Rest {display}</button>
    :
      <div style={{display:"flex",alignItems:"center",gap:10,animation:"fadeIn 0.2s ease"}}>
        <div style={{width:120,height:6,borderRadius:3,background:"rgba(255,255,255,0.06)",overflow:"hidden"}}>
          <div style={{width:`${pct*100}%`,height:"100%",borderRadius:3,background:"rgba(96,165,250,0.5)",transition:"width 1s linear"}}/>
        </div>

// ── Session Timer (overall elapsed) ──
function SessionTimer({startTime}){
  const[elapsed,setElapsed]=useState(0);
  useEffect(()=>{
    if(!startTime)return;
    const tick=()=>setElapsed(Math.round((Date.now()-startTime)/1000));
    tick();
    const id=setInterval(tick,1000);
    return()=>clearInterval(id);
  },[startTime]);
  const m=Math.floor(elapsed/60);
  const s=elapsed%60;
  return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px 0",marginBottom:8}}>
    <span style={{fontSize:11,color:"rgba(255,255,255,0.2)",fontFamily:"'Fira Code',monospace",textTransform:"uppercase",letterSpacing:1}}>Session</span>
    <span style={{fontSize:22,fontWeight:700,fontFamily:"'Fira Code',monospace",color:"rgba(255,255,255,0.6)",minWidth:60,textAlign:"center"}}>{m}:{String(s).padStart(2,"0")}</span>
  </div>);
}

// ── Components ──
function PainTrend({sessions,id}){
  if(sessions.length<2)return null;
  const vals=sessions.slice(-14).map(s=>s.dailyPain);
  const max=10,w=260,h=50,step=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${i*step},${h-(v/max)*h}`).join(" ");
  const area=pts+` ${(vals.length-1)*step},${h} 0,${h}`;
  const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  const d=vals[vals.length-1]-vals[0];
  const tc=d<-1?"#22c55e":d>1?"#ef4444":"#eab308";
  const tl=d<-1?"Improving":d>1?"Worsening":"Stable";
  return React.createElement("div",{style:{margin:"10px 0 2px"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
      React.createElement("span",{style:{fontSize:11,color:"rgba(255,255,255,0.22)",fontFamily:"'Fira Code',monospace"}},"Daily pain trend"),
      React.createElement("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        React.createElement("span",{style:{fontSize:11,fontFamily:"'Fira Code',monospace",color:tc,fontWeight:700}},tl),
        React.createElement("span",{style:{fontSize:10,color:"rgba(255,255,255,0.18)",fontFamily:"'Fira Code',monospace"}},"avg "+avg))),
    <svg viewBox={`-4 -4 ${w+12} ${h+8}`} width="100%" height={h+8}>
      <defs><linearGradient id={`g-${id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={tc} stopOpacity="0.15"/><stop offset="100%" stopColor={tc} stopOpacity="0"/></linearGradient></defs>
      <line x1="0" y1={h-(DAILY_PAIN_THRESHOLD/max)*h} x2={w} y2={h-(DAILY_PAIN_THRESHOLD/max)*h} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 3"/>
      <polygon points={area} fill={`url(#g-${id})`}/><polyline points={pts} fill="none" stroke={tc} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      {vals.map((v,i)=><circle key={i} cx={i*step} cy={h-(v/max)*h} r={i===vals.length-1?3.5:2} fill={i===vals.length-1?tc:"rgba(255,255,255,0.25)"} stroke={i===vals.length-1?"#0a0a0f":"none"} strokeWidth="2"/>)}
    </svg>);
}

// ── Skip Day Check-In Modal (failsafe — logs yesterday's pain) ──
function SkipDayCheckin({tracks,onSubmit,onDismiss}){
  const[pains,setPains]=useState(()=>{const p={};tracks.forEach(t=>p[t]=3);return p;});

    const out={};
    tracks.forEach(t=>{ out[t]=skipped[t]?null:pains[t]; });

  };
  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16,animation:"fadeIn 0.3s ease"}}>

      <div style={{fontSize:11,color:"rgba(96,165,250,0.5)",fontFamily:"'Fira Code',monospace",marginBottom:20}}>Can't remember? Hit Skip on that one.</div>
      {tracks.map(t=><div key={t} style={{marginBottom:16,opacity:skipped[t]?0.35:1,transition:"opacity 0.2s"}}>

          <div style={{fontSize:13,fontWeight:600,color:"rgba(255,255,255,0.6)"}}>{getTrackMeta(t).icon} {getTrackMeta(t).shortLabel} — daily life yesterday</div>
          <button onClick={()=>toggleSkip(t)} style={{background:skipped[t]?"rgba(96,165,250,0.12)":"rgba(255,255,255,0.04)",border:skipped[t]?"1px solid rgba(96,165,250,0.3)":"1px solid rgba(255,255,255,0.05)",color:skipped[t]?"rgba(96,165,250,0.8)":"rgba(255,255,255,0.25)",borderRadius:7,padding:"3px 9px",fontSize:10.5,fontFamily:"'Fira Code',monospace",fontWeight:700,cursor:"pointer"}}>

  </div>);

function App(){
  const[state,setState]=useState(()=>loadState());
  const[track,setTrack]=useState(null);
  const[inSession,setInSession]=useState(false);
  const[checked,setChecked]=useState({});
  const[sPain,setSPain]=useState(3);
  const[dPain,setDPain]=useState(3);
  const[notes,setNotes]=useState("");
  const[unlock,setUnlock]=useState(null);
  const[showBreakdown,setShowBreakdown]=useState(null);
  const[editPainLog,setEditPainLog]=useState(null);
  const[vPhase,setVPhase]=useState(null);
  const[skipCheck,setSkipCheck]=useState(null);
  const[logRestDayFor,setLogRestDayFor]=useState(null);
  const sessionStartRef=useRef(null);

  // Failsafe: fire only if yesterday had no entry at all (rest day button wasn't used)
  useEffect(()=>{
    const st=loadState();
    const missed=[];
    TRACKS.map(t=>t.key).forEach(t=>{
      const s=st[t].sessions;
      if(s.length===0)return;
      const hadYesterday=s.some(x=>x.date===YESTERDAY());
      const doneToday=s.some(x=>x.date===TODAY());
      if(!hadYesterday&&!doneToday)missed.push(t);
    });
    if(missed.length>0)setSkipCheck(missed);
  },[]);

  const goToTrack=useCallback(t=>{setTrack(t);setVPhase(null);history.pushState({view:"track",track:t},"");},[]);
  const goHome=useCallback(()=>{setTrack(null);setInSession(false);setChecked({});setVPhase(null);},[]);

  useEffect(()=>{
    const onBack=e=>{
      if(inSession){e.preventDefault();history.pushState(null,"");setInSession(false);setChecked({});setNotes("");sessionStartRef.current=null;}
      else if(track){goHome();}
    };
    window.addEventListener("popstate",onBack);
    return()=>window.removeEventListener("popstate",onBack);
  },[track,inSession,goHome]);

  const startSession=useCallback(()=>{setInSession(true);sessionStartRef.current=Date.now();history.pushState({view:"session"},"");},[]);
  const persist=useCallback(ns=>{setState(ns);saveState(ns);},[]);
  const withRefs=(sessions,t)=>sessions.map((s,i)=>({...s,_idx:i,_track:t}));

  // Handle skip-day check-in submission — pain===null means user skipped that track
  const handleSkipCheckin=useCallback(pains=>{
    let ns={...state};
    Object.entries(pains).forEach(([t,pain])=>{
      if(pain===null)return;
      const checkin={date:YESTERDAY(),sessionPain:0,dailyPain:pain,phase:ns[t].phase,notes:"Missed day check-in",type:"checkin"};
      ns={...ns,[t]:{...ns[t],sessions:[...ns[t].sessions,checkin]}};
    });
    persist(ns);
    setSkipCheck(null);
  },[state,persist]);

  // Handle rest day button from dashboard
  const handleRestDay=useCallback((t,pain)=>{
    const entry={date:TODAY(),sessionPain:0,dailyPain:pain,phase:state[t].phase,notes:"Rest day",type:"restday"};
    persist({...state,[t]:{...state[t],sessions:[...state[t].sessions,entry]}});
    setLogRestDayFor(null);
  },[state,persist]);

  const handlePainLogSave=useCallback(entry=>{
    const t=entry._track;
    const idx=entry._idx;
    if(!t||idx==null||!state[t]?.sessions[idx])return;
    const sessions=state[t].sessions.slice();
    const old=sessions[idx];
    sessions[idx]={...old,dailyPain:entry.dailyPain};
    if(old.type!=="checkin"&&old.type!=="restday"){
      sessions[idx]={...sessions[idx],sessionPain:entry.sessionPain,notes:entry.notes};
    }
    persist({...state,[t]:{...state[t],sessions}});
    setEditPainLog(null);
  },[state,persist]);

  const trackMeta=getTrackMeta(track);
  const phases=trackMeta.ph;
  const ts=track?state[track]:null;
  const regularPhaseCount=phases.filter(p=>!p.flarePhase).length;
  const activePhaseId=vPhase||ts?.phase;
  const curPhase=ts?phases.find(p=>p.id===ts.phase):null;
  const dispPhase=vPhase?phases.find(p=>p.id===vPhase):curPhase;
  const pSess=ts?withRefs(ts.sessions,track).filter(s=>s.phase===activePhaseId):[];
  const pSessReal=pSess.filter(s=>s.type!=="checkin"&&s.type!=="restday");
  const dAvgSess=pSess.slice(-SESSIONS_TO_UNLOCK);
  const dAvg=dAvgSess.length?(dAvgSess.reduce((a,s)=>a+s.dailyPain,0)/dAvgSess.length).toFixed(1):"—";
  const sAvg=pSessReal.length?(pSessReal.reduce((a,s)=>a+s.sessionPain,0)/pSessReal.length).toFixed(1):"—";
  const canAdv=ts&&!dispPhase?.flarePhase&&pSessReal.length>=SESSIONS_TO_UNLOCK&&parseFloat(dAvg)<=DAILY_PAIN_THRESHOLD&&ts.phase<regularPhaseCount;
  const doneToday=ts?ts.sessions.some(s=>s.date===TODAY()&&s.phase===activePhaseId&&s.type!=="checkin"&&s.type!=="restday"):false;
  const pc=v=>v==="—"?"#555":parseFloat(v)<=2?"#22c55e":parseFloat(v)<=DAILY_PAIN_THRESHOLD?"#4ade80":parseFloat(v)<=5?"#eab308":"#ef4444";
  const sessWithDur=pSessReal.filter(s=>s.duration>0);
  const avgDurSec=sessWithDur.length?Math.round(sessWithDur.reduce((a,s)=>a+s.duration,0)/sessWithDur.length):null;
  const fmtDur=sec=>sec?`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`:"—";

  // All sets checked?
  const exercises=dispPhase?.exercises||[];
  const allChecked=exercises.every((ex,ei)=>Array.from({length:ex.sets},(_,s)=>checked[`${ei}-${s}`]).every(Boolean));
  const isCur=activePhaseId===ts?.phase||!!dispPhase?.flarePhase;

  const complete=()=>{
    const durSec=sessionStartRef.current?Math.round((Date.now()-sessionStartRef.current)/1000):0;
    const sess={date:TODAY(),sessionPain:sPain,dailyPain:dPain,phase:activePhaseId,notes:notes.trim(),setsCompleted:Object.values(checked).filter(Boolean).length,duration:durSec};
    const newS=[...ts.sessions.filter(s=>!(s.date===TODAY()&&s.phase===activePhaseId&&s.type!=="checkin")),sess];
    persist({...state,[track]:{...ts,sessions:newS}});
    sfx.complete();
    setInSession(false);setChecked({});setSPain(3);setDPain(3);setNotes("");sessionStartRef.current=null;
    history.back();
  };

  const advance=()=>{const n=ts.phase+1;persist({...state,[track]:{...ts,phase:n}});sfx.unlock();setUnlock(n);setTimeout(()=>setUnlock(null),3500);};
  const reset=()=>{if(confirm("Reset all progress for this track?")){persist({...state,[track]:{phase:1,sessions:[]}});setVPhase(null);}};
  const root={minHeight:"100vh",minHeight:"100dvh",background:"#0a0a0f",color:"#fff",fontFamily:"'Outfit',sans-serif",maxWidth:460,margin:"0 auto",padding:"0 16px 100px"};

  // Skip day check-in overlay
  if(skipCheck)return(<div style={root}><SkipDayCheckin tracks={skipCheck} onSubmit={handleSkipCheckin} onDismiss={()=>setSkipCheck(null)}/></div>);

  // Rest day modal overlay
  const restDayOverlay=logRestDayFor?<RestDayModal track={logRestDayFor} onSubmit={handleRestDay} onDismiss={()=>setLogRestDayFor(null)}/>:null;

  // DASHBOARD
  if(!track){
    return(<div style={root}>
      {restDayOverlay}
      {showBreakdown&&<PainBreakdownModal sessions={showBreakdown} onClose={()=>setShowBreakdown(null)} onEdit={s=>{setShowBreakdown(null);setEditPainLog(s);}} threshold={DAILY_PAIN_THRESHOLD} pc={pc}/>}
      {editPainLog&&<PainLogEditModal entry={editPainLog} onSave={handlePainLogSave} onClose={()=>setEditPainLog(null)} pc={pc}/>}
      <div style={{padding:"44px 0 20px",animation:"fadeIn 0.35s ease"}}>
        <div style={{fontSize:10,fontFamily:"'Fira Code',monospace",color:"rgba(255,255,255,0.18)",letterSpacing:2.5,textTransform:"uppercase",marginBottom:8}}>Rehab Protocol <span style={{opacity:0.4}}>build 2026-07-30</span></div>
        <h1 style={{fontSize:26,fontWeight:800,lineHeight:1.15,letterSpacing:-0.5}}>Recovery</h1>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.3)",marginTop:6}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
      </div>
      {TRACKS.map((t,ti)=>{
        const d=state[t.key],phase=t.ph.find(p=>p.id===d.phase);
        const regCount=t.ph.filter(p=>!p.flarePhase).length;
        const ps=withRefs(d.sessions,t.key).filter(s=>s.phase===d.phase);
        const psReal=ps.filter(s=>s.type!=="checkin"&&s.type!=="restday");
        const done=d.sessions.some(s=>s.date===TODAY()&&s.phase===d.phase&&s.type!=="checkin"&&s.type!=="restday");
        const restToday=d.sessions.some(s=>s.date===TODAY()&&s.phase===d.phase&&s.type==="restday");
        const daS=ps.slice(-SESSIONS_TO_UNLOCK);const da=daS.length?(daS.reduce((a,s)=>a+s.dailyPain,0)/daS.length).toFixed(1):"—";
        return(<div key={t.key} onClick={()=>goToTrack(t.key)}
          style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.045)",borderRadius:18,padding:"20px 18px",marginBottom:12,cursor:"pointer",transition:"all 0.2s",animation:`fadeIn 0.4s ease both`,animationDelay:`${(ti+1)*80}ms`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div><span style={{fontSize:18}}>{t.icon}</span><div style={{fontSize:17,fontWeight:700,marginTop:4}}>{t.label}</div><div style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginTop:2}}>{t.sub}</div></div>
            {done&&<span style={{fontSize:10,fontFamily:"'Fira Code',monospace",fontWeight:700,color:"#22c55e",background:"rgba(34,197,94,0.07)",padding:"3px 8px",borderRadius:6}}>DONE TODAY</span>}
            {restToday&&!done&&<span style={{fontSize:10,fontFamily:"'Fira Code',monospace",fontWeight:700,color:"rgba(96,165,250,0.7)",background:"rgba(96,165,250,0.07)",padding:"3px 8px",borderRadius:6}}>REST TODAY</span>}
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.25)",fontFamily:"'Fira Code',monospace",marginTop:12}}>Phase {d.phase}/{regCount} · {phase?.name}</div>
          <div style={{marginTop:8}}><Streak count={psReal.length} req={SESSIONS_TO_UNLOCK}/></div>
          <div style={{display:"flex",gap:8,marginTop:12}}><Stat label="Total Sessions" value={d.sessions.filter(s=>s.type!=="checkin"&&s.type!=="restday").length}/><Stat label="Daily Pain Avg" value={da} color={pc(da)} sub={`Target: <=3`} onClick={daS.length?e=>{e.stopPropagation();setShowBreakdown(daS);}:undefined}/></div>
          {ps.length>=2&&<PainTrend sessions={ps} id={`${t.key}-d`}/>}
          {!done&&!restToday&&<button onClick={e=>{e.stopPropagation();setLogRestDayFor(t.key);}} style={{width:"100%",marginTop:14,padding:"10px",borderRadius:10,border:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.02)",color:"rgba(255,255,255,0.3)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>🛌 Log Rest Day</button>}
        </div>);
      })}
      <div style={{marginTop:16,padding:16,background:"rgba(255,255,255,0.012)",borderRadius:14,border:"1px solid rgba(255,255,255,0.025)"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:0.8,marginBottom:6}}>Progression Rules</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.25)",lineHeight:1.7}}>Complete <strong style={{color:"rgba(255,255,255,0.45)"}}>{SESSIONS_TO_UNLOCK} sessions</strong> with a <strong style={{color:"rgba(255,255,255,0.45)"}}>daily-life pain avg ≤ {DAILY_PAIN_THRESHOLD}/10</strong> to unlock the next phase. During exercise, keep pain mild, controlled, and back to baseline by the next morning. Rest-day check-ins feed your pain average but don't count as sessions.</div>
      </div>
      <div style={{marginTop:10,padding:16,background:"rgba(239,68,68,0.025)",borderRadius:14,border:"1px solid rgba(239,68,68,0.07)"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(248,113,113,0.65)",textTransform:"uppercase",letterSpacing:0.8,marginBottom:6}}>Get assessed promptly if</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.25)",lineHeight:1.7}}><strong style={{color:"rgba(255,255,255,0.42)"}}>Knee:</strong> The knee locks, gives way repeatedly, swells substantially, cannot bear weight, follows a major injury, or pain is severe or worsening despite reducing load.<br/><strong style={{color:"rgba(255,255,255,0.42)"}}>Forearm:</strong> New or worsening numbness/tingling, hand or thumb/index weakness, dropping objects, loss of grip or function, major swelling/deformity, redness/heat, or severe/worsening pain needs clinical review; sudden loss of power or feeling needs urgent care. This tracker supports—not replaces—an individualized clinician assessment.</div>
      </div>
    </div>);
  }

  // TRACK DETAIL
  return(<div style={root}>
    {showBreakdown&&<PainBreakdownModal sessions={showBreakdown} onClose={()=>setShowBreakdown(null)} onEdit={s=>{setShowBreakdown(null);setEditPainLog(s);}} threshold={DAILY_PAIN_THRESHOLD} pc={pc}/> }
    {editPainLog&&<PainLogEditModal entry={editPainLog} onSave={handlePainLogSave} onClose={()=>setEditPainLog(null)} pc={pc}/>}
    {unlock&&<div onClick={()=>setUnlock(null)} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,animation:"fadeIn 0.2s ease"}}>
      <div style={{background:"#111118",border:"1.5px solid rgba(34,197,94,0.25)",borderRadius:22,padding:"44px 32px",textAlign:"center",maxWidth:300,animation:"burst 0.5s ease"}}>
        <div style={{fontSize:52,marginBottom:14}}>🔓</div><div style={{fontSize:22,fontWeight:800}}>Phase {unlock}</div>
        <div style={{fontSize:15,color:"#22c55e",fontWeight:600,marginTop:4}}>{phases.find(p=>p.id===unlock)?.name}</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.3)",marginTop:10,lineHeight:1.5}}>{phases.find(p=>p.id===unlock)?.rationale}</div>
      </div>
    </div>}

    <div style={{padding:"18px 0 10px",display:"flex",alignItems:"center",gap:12,animation:"fadeIn 0.25s ease"}}>
      <button onClick={()=>history.back()} style={{background:"rgba(255,255,255,0.04)",border:"none",color:"#fff",width:34,height:34,borderRadius:9,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
      <div><div style={{fontSize:16,fontWeight:700}}>{trackMeta.icon} {trackMeta.label}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{trackMeta.sub}</div></div>
    </div>

    <TL total={regularPhaseCount} cur={Math.min(ts.phase,regularPhaseCount)}/>

    <div style={{display:"flex",gap:5,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
      {phases.map(p=>{const locked=p.flarePhase?false:p.id>ts.phase,active=activePhaseId===p.id;
        return <button key={p.id} onClick={()=>!locked&&setVPhase(p.id)} disabled={locked} style={{padding:"5px 11px",borderRadius:7,border:"none",fontSize:10.5,fontFamily:"'Fira Code',monospace",fontWeight:700,cursor:locked?"not-allowed":"pointer",background:active?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.015)",color:locked?"rgba(255,255,255,0.08)":active?"#fff":"rgba(255,255,255,0.3)",whiteSpace:"nowrap"}}>{locked?"🔒 ":""}{p.flarePhase?"PAIN":`P${p.id}`}</button>;
      })}
    </div>

    <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.04)",borderRadius:16,padding:18,marginBottom:14,animation:"fadeIn 0.3s ease"}}>
      <div style={{fontSize:15,fontWeight:700}}>{dispPhase?.flarePhase?"Pain Return Phase":`Phase ${dispPhase?.id}`}: {dispPhase?.name}</div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginTop:6,lineHeight:1.6,borderLeft:"2px solid rgba(255,255,255,0.05)",paddingLeft:12}}>{dispPhase?.rationale}</div>
      {track==="forearm"&&<div style={{fontSize:11,color:"rgba(248,113,113,0.7)",lineHeight:1.55,marginTop:10,padding:"9px 11px",background:"rgba(239,68,68,0.035)",border:"1px solid rgba(239,68,68,0.08)",borderRadius:9}}>Stop this pathway and seek assessment for numbness/tingling into the hand, new grip or pinch weakness, dropping objects, visible muscle loss, or worsening loss of function. Sudden loss of power or feeling, major deformity/swelling, or a hot red swollen arm needs urgent care.</div>}
      <div style={{display:"flex",alignItems:"flex-start",gap:8,marginTop:12,padding:"10px 12px",background:"rgba(96,165,250,0.04)",border:"1px solid rgba(96,165,250,0.08)",borderRadius:10}}><span style={{fontSize:14,flexShrink:0}}>📅</span><div style={{fontSize:12,color:"rgba(147,197,253,0.7)",lineHeight:1.5}}>{dispPhase?.freq}</div></div>
      {isCur&&<>
        <div style={{display:"flex",gap:7,marginTop:14}}>
          <Stat label="Sessions" value={pSessReal.length} sub={dispPhase?.flarePhase?"pain return":ts.phase===regularPhaseCount?"maintenance":`of ${SESSIONS_TO_UNLOCK}`}/>
          <Stat label="Daily Pain" value={dAvg} color={pc(dAvg)} sub={dispPhase?.flarePhase?`Target: <=2`:ts.phase===regularPhaseCount?`Target: <=3`:`<=3 to advance`} onClick={dAvgSess.length?()=>setShowBreakdown(dAvgSess):undefined}/>
          <Stat label="Sess. Pain" value={sAvg} color={pc(sAvg)} sub="Info only"/>
          <Stat label="Avg Time" value={fmtDur(avgDurSec)} sub="per session"/>
        </div>
        <div style={{marginTop:10}}><Streak count={Math.min(pSessReal.length,SESSIONS_TO_UNLOCK)} req={SESSIONS_TO_UNLOCK}/></div>
        <PainTrend sessions={pSess} id={`${track}-det`}/>
      </>}
    </div>

    {canAdv&&!inSession&&isCur&&<button onClick={advance} style={{width:"100%",padding:"15px",borderRadius:14,border:"2px solid rgba(34,197,94,0.3)",background:"rgba(34,197,94,0.05)",color:"#22c55e",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:14,animation:"pulse 2s ease infinite"}}>🔓 Unlock Phase {ts.phase+1}: {phases.find(p=>p.id===ts.phase+1)?.name}</button>}

    {!dispPhase?.flarePhase&&!canAdv&&pSessReal.length>=SESSIONS_TO_UNLOCK&&parseFloat(dAvg)>DAILY_PAIN_THRESHOLD&&isCur&&!inSession&&<div style={{padding:"13px 15px",borderRadius:12,background:"rgba(239,68,68,0.04)",border:"1px solid rgba(239,68,68,0.1)",marginBottom:14,fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.6}}>⚠️ Sessions complete, but daily pain avg is {dAvg}/10 — needs to be ≤{DAILY_PAIN_THRESHOLD}. Keep at it.</div>}

    {ts.phase===regularPhaseCount&&!dispPhase?.flarePhase&&pSessReal.length>=SESSIONS_TO_UNLOCK&&parseFloat(dAvg)<=DAILY_PAIN_THRESHOLD&&isCur&&!inSession&&<div style={{padding:"16px",borderRadius:14,background:"rgba(34,197,94,0.04)",border:"1.5px solid rgba(34,197,94,0.15)",marginBottom:14}}><div style={{fontSize:15,fontWeight:700,color:"#22c55e",marginBottom:6}}>🏆 Maintenance Mode</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.7}}>Keep logging 2-3x per week. If pain creeps back, use the PAIN phase.</div></div>}

    {inSession&&<SessionTimer startTime={sessionStartRef.current}/>}

    {inSession&&dispPhase?.warmup&&<div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"12px 14px",background:"rgba(250,204,21,0.04)",border:"1px solid rgba(250,204,21,0.1)",borderRadius:12,marginBottom:12,animation:"fadeIn 0.25s ease"}}><span style={{fontSize:16,flexShrink:0}}>🔥</span><div><div style={{fontSize:12,fontWeight:700,color:"rgba(253,224,71,0.8)",marginBottom:2}}>Warm up first</div><div style={{fontSize:12,color:"rgba(255,255,255,0.35)",lineHeight:1.5}}>{dispPhase.warmup}</div></div></div>}

    <div style={{marginBottom:14}}>
      <div style={{fontSize:10,fontFamily:"'Fira Code',monospace",color:"rgba(255,255,255,0.18)",textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Exercises · {exercises.length}</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {exercises.map((ex,i)=><ExCard key={i} ex={ex} idx={i} active={inSession&&isCur} checked={checked} onToggleSet={key=>setChecked(p=>({...p,[key]:!p[key]}))}/>)}
      </div>
    </div>

    {isCur&&<>
      {!inSession&&!doneToday&&<button onClick={startSession} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:"#22c55e",color:"#000",fontSize:15,fontWeight:700,cursor:"pointer"}}>Start Session</button>}
      {doneToday&&!inSession&&<div style={{width:"100%",padding:"15px",borderRadius:14,border:"1px solid rgba(34,197,94,0.12)",background:"rgba(34,197,94,0.03)",color:"#22c55e",fontSize:14,fontWeight:600,textAlign:"center"}}>✓ Session completed today</div>}
      {inSession&&<div style={{animation:"fadeIn 0.25s ease"}}>
        <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.04)",borderRadius:16,padding:18,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Post-Session Check-In</div>
          <PainSlider value={sPain} onChange={setSPain} label="During the exercises" sub="How much did it hurt? (tracked but doesn't gate you)"/>
          <PainSlider value={dPain} onChange={setDPain} label="Daily life right now" sub={`How does your ${trackMeta.shortLabel.toLowerCase()} feel with normal daily activity? This gates progression.`}/>
          <div style={{marginTop:4}}>
            <div style={{fontSize:13,fontWeight:600,color:"rgba(255,255,255,0.45)",marginBottom:4}}>Notes <span style={{fontWeight:400,color:"rgba(255,255,255,0.18)"}}>(optional)</span></div>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Anything notable?" rows={2} style={{width:"100%",padding:"10px 12px",borderRadius:10,background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.05)",color:"#fff",fontSize:13,resize:"vertical",outline:"none"}}/>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>history.back()} style={{flex:1,padding:14,borderRadius:12,border:"1px solid rgba(255,255,255,0.07)",background:"transparent",color:"rgba(255,255,255,0.35)",fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancel</button>
          <button onClick={complete} disabled={!allChecked} style={{flex:2,padding:14,borderRadius:12,border:"none",background:allChecked?"#22c55e":"rgba(255,255,255,0.03)",color:allChecked?"#000":"rgba(255,255,255,0.12)",fontSize:14,fontWeight:700,cursor:allChecked?"pointer":"not-allowed"}}>Complete Session</button>
        </div>
      </div>}
    </>}

    {pSess.length>0&&isCur&&!inSession&&<div style={{marginTop:20}}>
      <div style={{fontSize:10,fontFamily:"'Fira Code',monospace",color:"rgba(255,255,255,0.18)",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Recent Sessions</div>
      {pSess.slice(-5).reverse().map((s,i)=><div key={s._idx??i} onClick={()=>setEditPainLog(s)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 13px",borderRadius:9,background:"rgba(255,255,255,0.012)",border:"1px solid rgba(255,255,255,0.025)",marginBottom:4,fontSize:11.5,cursor:"pointer"}}>
        <div style={{minWidth:0,flex:1}}><span style={{color:"rgba(255,255,255,0.4)",fontFamily:"'Fira Code',monospace"}}>{s.date}</span>{(s.type==="checkin"||s.type==="restday")&&<span style={{color:"rgba(96,165,250,0.5)",marginLeft:6,fontSize:10,fontFamily:"'Fira Code',monospace"}}>{s.type==="restday"?"REST DAY":"MISSED DAY"}</span>}<span style={{color:"rgba(34,197,94,0.7)",marginLeft:6,fontSize:9,fontFamily:"'Fira Code',monospace",fontWeight:700,background:"rgba(34,197,94,0.07)",padding:"1px 5px",borderRadius:4}}>EDIT</span>{s.duration>0&&<span style={{color:"rgba(147,197,253,0.65)",marginLeft:8,fontSize:10.5,fontFamily:"'Fira Code',monospace",fontWeight:700,background:"rgba(96,165,250,0.07)",padding:"1px 6px",borderRadius:4}}>⏱ {Math.floor(s.duration/60)}:{String(s.duration%60).padStart(2,"0")}</span>}{s.notes&&s.type!=="checkin"&&s.type!=="restday"&&<span style={{color:"rgba(255,255,255,0.18)",marginLeft:8,fontStyle:"italic"}}>{s.notes}</span>}</div>
        <div style={{display:"flex",gap:10,fontFamily:"'Fira Code',monospace",flexShrink:0}}>{s.type!=="checkin"&&s.type!=="restday"&&<span style={{color:"rgba(255,255,255,0.25)"}}>sess:<span style={{color:pc(String(s.sessionPain))}}>{s.sessionPain}</span></span>}<span style={{color:"rgba(255,255,255,0.25)"}}>daily:<span style={{color:pc(String(s.dailyPain)),fontWeight:700}}>{s.dailyPain}</span></span></div>
      </div>)}
    </div>}

    <div style={{marginTop:32,textAlign:"center"}}><button onClick={reset} style={{background:"none",border:"none",color:"rgba(255,255,255,0.08)",fontSize:11,fontFamily:"'Fira Code',monospace",cursor:"pointer"}}>Reset progress</button></div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
